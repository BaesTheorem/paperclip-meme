name: ClippyMeme
options:
  bundleIdPrefix: com.alexhedtke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ClippyMeme:
    type: application
    platform: iOS
    sources:
      - path: ClippyMeme/Sources
      - path: ClippyMeme/Resources
      # Blue folder reference: index.html and clippy.webp land in the bundle
      # under web/, served to the WKWebView through a custom URL scheme.
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: ClippyMeme/Info.plist
      properties:
        CFBundleDisplayName: Clippy Meme
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Saves the meme you made to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexhedtke.clippymeme
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
